<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — okfsmith docs</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}} — okfsmith docs">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:site_name" content="okfsmith docs">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}} — okfsmith docs">
  <meta name="twitter:description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/docs.css">
{{jsonld}}</head>
<body data-page="{{active_slug}}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <button id="drawer-open" class="hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="index.html">
      <img src="assets/img/logo.svg" alt="okfsmith logo" width="28" height="28">
      <span class="wordmark">okfsmith</span>
    </a>
    <span class="brand-divider" aria-hidden="true"></span>
    <span class="docs-label">Docs</span>
    <a class="site-link" href="site/">Website</a>
    <span class="lang-chip" aria-label="Language: English">EN</span>
    <button id="search-open" class="search-trigger" type="button" aria-haspopup="dialog" aria-controls="search-modal">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="search-placeholder">Search docs&hellip;</span>
      <span class="search-kbd"><kbd>Ctrl</kbd><kbd>K</kbd></span>
    </button>
    <a class="cta" href="https://github.com/Bilal-Junaid-Jiwani/okfsmith">Open okfsmith</a>
  </header>

  <nav class="tabs" aria-label="Documentation sections">
    <div class="tabs-inner">
      <ul class="tab-list">
        {{tabs_html}}
      </ul>
    </div>
  </nav>

  <div class="layout docs-shell">
    <aside class="sidebar" id="sidebar" aria-label="Page navigation">
      <button id="drawer-close" class="drawer-close" type="button" aria-label="Close navigation">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
      </button>
      {{sidebar_html}}
    </aside>
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>

    <main class="content" id="main" tabindex="-1">
      <details class="toc-mobile">
        <summary>On this page</summary>
        {{toc_html}}
      </details>
      <p class="eyebrow">{{eyebrow}}</p>
      <div class="title-row">
        <h1>{{h1}}</h1>
        <button id="copy-page" class="copy-page" type="button" aria-label="Copy this page as text">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="4.5" y="4.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M9.5 4.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>
          <span>Copy page</span>
        </button>
      </div>
      <div class="prose">
        {{content_html}}
      </div>
      <nav class="prev-next" aria-label="Previous and next page">
        {{prev_link}}
        {{next_link}}
      </nav>
    </main>

    <aside class="toc" aria-label="On this page">
      <p class="toc-title">On this page</p>
      {{toc_html}}
    </aside>
  </div>

  <div class="search-scrim" id="search-scrim" hidden></div>
  <div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search docs" hidden>
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="search-input" type="text" placeholder="Search docs&hellip;" aria-label="Search docs" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" autocomplete="off" spellcheck="false">
      <button id="search-close" class="search-close" type="button" aria-label="Close search">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <!-- Search results list is rendered by assets/js/search.js, which owns
         #search-input input handling and #search-results content.
         docs.js owns only open/close of this modal. -->
    <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-brand"><strong>okfsmith</strong> — the open knowledge forge.</p>
      <p class="footer-links">
        <a href="site/">Website</a>
        <a href="https://github.com/Bilal-Junaid-Jiwani/okfsmith">GitHub</a>
        <a href="https://pypi.org/project/okfsmith/">PyPI</a>
        <a href="install.html">Install</a>
        <a href="changelog.html">Changelog</a>
      </p>
    </div>
  </footer>

  <script src="assets/js/docs.js" defer></script>
  <script src="assets/js/search.js" defer></script>
</body>
</html>
