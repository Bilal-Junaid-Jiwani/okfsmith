[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "okfsmith"
version = "0.1.0"
description = "CLI that forges PDFs, markdown, and wikis into Open Knowledge Format (OKF) knowledge bundles"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX license expression (audit-4: the old {text=...} form is deprecated).
license = "Apache-2.0"
license-files = ["LICENSE*"]
authors = [{ name = "okfsmith-team" }]
keywords = [
    "okf",
    "open-knowledge-format",
    "knowledge-bundle",
    "knowledge-base",
    "knowledge-graph",
    "pdf",
    "markdown",
    "notion",
    "wiki",
    "cli",
    "mcp",
    "llm",
    "extraction",
    "ocr",
    "frontmatter",
    "agents",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12,<0.28",
    "pyyaml>=6,<7",
    "rich>=13,<16",
    "httpx>=0.27,<1",
    # Tier-1 PDF parsing: liteparse (run-llama, Apache-2.0, prebuilt wheels).
    # Fully offline: constructed with ocr_enabled=False, never calls paid OCR APIs.
    # PyMuPDF deliberately avoided (AGPL).
    "liteparse>=2.14,<3",
]

[project.scripts]
okfsmith = "okfsmith.cli.app:app"

[project.optional-dependencies]
mcp = ["fastmcp>=2.0,<5"]
ocr = ["docling>=2.130,<3"]
test = ["pytest>=8,<10"]
# Office formats (MIT). Floor >=0.1.5 is a SECURITY requirement:
# markitdown<=0.1.3 pulls mammoth<1.11.0 (CVE-2025-11849, CVSS 9.3,
# arbitrary file read via crafted DOCX) and pdfminer.six<=20250506
# (CVE-2025-64512, RCE via crafted PDF). >=0.1.5 pins mammoth~=1.11.0
# (patched) and pdfminer-six>=20251230 (patched).
office = ["markitdown[docx,pptx,xlsx]>=0.1.5,<0.2"]

[project.urls]
Homepage = "https://github.com/Bilal-Junaid-Jiwani/okfsmith"
Repository = "https://github.com/Bilal-Junaid-Jiwani/okfsmith"
Documentation = "https://github.com/Bilal-Junaid-Jiwani/okfsmith#readme"
Issues = "https://github.com/Bilal-Junaid-Jiwani/okfsmith/issues"
Changelog = "https://github.com/Bilal-Junaid-Jiwani/okfsmith/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["okfsmith"]
