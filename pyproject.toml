[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "okfsmith"
version = "0.7.3"
description = "CLI that forges PDFs, markdown, and wikis into Open Knowledge Format (OKF) knowledge bundles"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX license expression (audit-4: the old {text=...} form is deprecated).
license = "Apache-2.0"
license-files = ["LICENSE*"]
authors = [{ name = "okfsmith-team" }]
keywords = [
    "okf",
    "open-knowledge-format",
    "knowledge-bundle",
    "knowledge-base",
    "knowledge-graph",
    "pdf",
    "markdown",
    "notion",
    "wiki",
    "cli",
    "mcp",
    "llm",
    "extraction",
    "ocr",
    "frontmatter",
    "agents",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12,<0.28",
    "pyyaml>=6,<7",
    "rich>=13,<16",
    "httpx>=0.27,<1",
    # SECURITY floors (enforced by the pip-audit gate in CI):
    # - fastapi>=0.122 pulls starlette>=1.x, fixing the PYSEC-2026-*
    #   advisories affecting starlette 0.50.x.
    # - uvicorn>=0.35 is required by fastmcp>=3.2 (server extra); the old
    #   <0.32 cap forced pip to resolve the vulnerable fastmcp 2.13.0.2.
    "fastapi>=0.122,<0.143",
    "uvicorn>=0.35,<0.55",
    # Multipart form parsing for the dashboard's file-upload endpoint.
    "python-multipart>=0.0.18,<0.0.40",
    # Tier-1 PDF parsing: liteparse (run-llama, Apache-2.0, prebuilt wheels).
    # Fully offline: constructed with ocr_enabled=False, never calls paid OCR APIs.
    # PyMuPDF deliberately avoided (AGPL).
    "liteparse>=2.14,<3",
]

[project.scripts]
okfsmith = "okfsmith.cli.app:app"

[project.optional-dependencies]
# Floor >=3.2 is a SECURITY requirement: fastmcp<3.2 has published
# advisories (PYSEC-2026-2474/2475/2476, GHSA-rcfx-77hg-w2wv) that fail
# the pip-audit gate in CI.
mcp = ["fastmcp>=3.2,<5"]
ocr = ["docling>=2.130,<3"]
test = ["pytest>=8,<10"]
# Office formats (MIT). Floor >=0.1.5 is a SECURITY requirement:
# markitdown<=0.1.3 pulls mammoth<1.11.0 (CVE-2025-11849, CVSS 9.3,
# arbitrary file read via crafted DOCX) and pdfminer.six<=20250506
# (CVE-2025-64512, RCE via crafted PDF). >=0.1.5 pins mammoth~=1.11.0
# (patched) and pdfminer-six>=20251230 (patched).
office = ["markitdown[docx,pptx,xlsx]>=0.1.5,<0.2"]

[project.urls]
Homepage = "https://github.com/Bilal-Junaid-Jiwani/okfsmith"
Repository = "https://github.com/Bilal-Junaid-Jiwani/okfsmith"
Documentation = "https://github.com/Bilal-Junaid-Jiwani/okfsmith#readme"
Issues = "https://github.com/Bilal-Junaid-Jiwani/okfsmith/issues"
Changelog = "https://github.com/Bilal-Junaid-Jiwani/okfsmith/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# The web dashboard serves its SPA bundle from okfsmith/dashboard/static/.
# Without this, wheels ship only .py files and the dashboard shows the
# "frontend bundle has not been built yet" placeholder (seen on 0.5.1).
[tool.setuptools.package-data]
"okfsmith.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["okfsmith"]
