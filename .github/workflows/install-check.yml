name: install-check

# Release gate: prove the built artifact installs cleanly into an empty
# virtualenv and runs real commands, starting from outside the source tree.
# Runs on every release tag (tags are pushed before the PyPI upload) and on
# demand. If this job fails, the release must NOT be published to PyPI.
# Note: `python -m build` builds the wheel from the sdist, so a broken
# sdist already fails the build step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release artifact
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel into a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/pip" install --no-cache-dir dist/*.whl
      - name: Run real commands against the installed package
        working-directory: ${{ runner.temp }}
        run: |
          V="$RUNNER_TEMP/clean-venv"
          "$V/bin/python" -c "import okfsmith; assert 'site-packages' in okfsmith.__file__, okfsmith.__file__"
          python3 - <<'PY'
          paras = []
          for i in range(1, 7):
              paras.append(f"## Reliability Section {i}\n\n" + ("Widgets fail most often at the seal where pressure cycling loosens the gasket over time. " * 4))
          open('sample.md', 'w').write("# Widget Reliability Field Notes\n\n" + "\n\n".join(paras))
          PY
          "$V/bin/okfsmith" init kb --force --yes
          OUT="$("$V/bin/okfsmith" ingest ./kb sample.md --no-llm)"
          echo "$OUT"
          echo "$OUT" | grep -Eq "ingested [1-9][0-9]* concept"
          "$V/bin/okfsmith" validate ./kb
