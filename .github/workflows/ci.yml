name: ci

on:
  push:
    branches: [master, main, "polish/**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with test extras
        run: pip install -e ".[test]"
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src/ tests/
      - name: Tests
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          okfsmith --version
          okfsmith init "$RUNNER_TEMP/smoke-kb"
          python -c "
          import os
          d = os.environ['RUNNER_TEMP']
          open(os.path.join(d, 'smoke-doc.md'),'w').write('# A\n\n'+'x '*700+'\n\n# B\n\n'+'y '*700+'\n')"
          okfsmith ingest "$RUNNER_TEMP/smoke-kb" "$RUNNER_TEMP/smoke-doc.md" --no-llm --quiet
          okfsmith validate "$RUNNER_TEMP/smoke-kb"
      - name: Build + twine check
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[office,mcp]"
      - name: Dependency audit
        run: |
          pip install --upgrade pip pip-audit
          pip-audit
      - name: Secret scan
        run: |
          git grep -n -i -E "(api[_-]?key|secret|token|password)\s*[:=]\s*['\"][A-Za-z0-9_\-]{8,}['\"]" -- src/ tests/ || true
          test -z "$(git grep -n -E "sk-(live|test)-[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{8,}|xox[bap]-" -- . || true)"
      - name: Forbidden content
        run: |
          test -z "$(git grep -n "extractall(" -- src/ || true)"
          test -z "$(git grep -n "yaml\.load(" -- src/ || true)"
          # Forbid real PyMuPDF/fitz imports and dependency pins — the
          # "deliberately NOT used (AGPL)" comments are allowed.
          test -z "$(git grep -n -E "^[^#]*\b(import fitz|from fitz|import pymupdf|from pymupdf)" -- src/ || true)"
          test -z "$(git grep -n -i -E "^[^#]*pymupdf" -- pyproject.toml || true)"
